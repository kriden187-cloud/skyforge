  OMC3-N: ["OMC-3", "OMC 3", "Orion Molecular Cloud 3"]
  NGC-5253: ["NGC 5253", "NGC5253"]
  control_field: ["Westerlund 1 control field", "EWOCS control field"]   # контрольное поле GO-1905 (Westerlund 1)
  NGC-6553: ["NGC 6553", "NGC6553"]
  M-22: ["M22", "NGC 6656", "Messier 22"]
