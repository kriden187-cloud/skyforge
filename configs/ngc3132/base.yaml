# Туманность Южное Кольцо (NGC 3132), JWST NIRCam, программа ERO 2733.
# Общее для всех стилей: объект, данные, геометрия, очистка, маски. Стили лежат рядом
# (extends: base) и меняют только растяжку, цвет и финиш.
target: "NGC 3132"
mission: jwst
instrument: nircam
filters: [F090W, F187N, F212N, F356W, F405N, F470N]   # тот же набор, что в пресс-релизе
calib_level: 3            # готовая мозаика со всех экспозиций, а не отдельные кадры уровня 2
reference: F470N          # кадр, к сетке которого приводятся остальные
bin: 4                    # уменьшение для подбора параметров; 1 для финала
reference_image: data/reference/ngc3132_nasa.jpg   # пресс-релиз STScI 2022-033b — для sweep и сравнения стилей
stars:
  fill_cores: true        # насыщенные ядра (дыры WHT=0) заполняются кольцами → белые, без цветной точки
background:
  subtract: true          # до растяжки: пьедесталы плиток мозаики (слой CON) + гладкая модель градиентов
  tiles: true
  smooth: true
finish:
  north_up: false         # мозаика повёрнута на ~35°: поворот на север срезал бы 40% кадра
