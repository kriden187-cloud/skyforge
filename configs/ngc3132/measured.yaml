# «Измеренный» стиль: параметры, принятые в фазах 2–3а. Ничего не менять — это эталон.
extends: base
stretch:
  method: asinh
  anchor: masks           # black — по маске пустого неба, white — по маске туманности (очистка фона их не двигает)
  # Пересчёт принятых в фазе 3c значений (black 0.5 / white 99.8 по всему кадру) на маски: те же уровни.
  black: 0.7              # процентиль пустого неба
  white: 99.6             # процентиль туманности
  per_filter:
    F356W: { black: 1.9 } # у F356W в кадре больше тёмного края — по кадру 0.5 соответствовало 1.9 по небу
  a: 0.1                  # сила asinh, МЕНЬШЕ — СИЛЬНЕЕ: 0.02 из плана выжигала центр туманности (см. sweep)
color:
  mode: wavelength        # короткие волны → синий, длинные → красный
  blend: average          # screen при шести фильтрах сводит всё в жёлто-белое
  shadows: 4              # 3g: sweep 2/3/4 на кропах sky2 и внешних волокон — при 4 волокна читаются лучше, фон
                          # при обычной яркости остаётся чёрным (шум не проступает); 2 и 3 гасят слабые волокна
  saturation: 1.2
  overrides:              # палитра официального снимка STScI
    F090W: "#0000ff"      # синий
    F187N: "#00ffff"      # голубой
    F212N: "#00ff00"      # зелёный
    F356W: "#ffff00"      # жёлтый
    F405N: "#ff0000"      # красный
    F470N: "#ff0000"      # красный
  weights: { F212N: 0.25 } # 3g: ореол H2 настоящий (совпадает с i2d STScI), 0.5 даёт зелёный, 0.25 оранжевый
  star_saturation: 0.3    # звёзды поля почти белые; 1 — как есть, 0 — серые (маска звёзд — этап clean)
finish:
  denoise: 0.1            # 0.3 давал «пластилин» на 100%
  sharpen: 0.5
