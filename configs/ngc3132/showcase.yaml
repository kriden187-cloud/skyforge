# «Витринный» стиль: ближе к пресс-релизу STScI — оболочка красно-оранжевая, середина голубая, фон чёрный.
# Те же данные, очистка и маски, что у measured; меняются только растяжка и цвет.
extends: measured
stretch:
  black_mode: pedestal     # 3k: чёрная точка на 3σ ниже неба самых шумных мест — шум неба не обрезается в 0
  black_k: 3
  sky_level: 6             # 3k: носок — медиана неба каждого фильтра → 6 уровней из 255, шум ниже сжат без обрезки
  sky_poly_order: 2        # 3k п.3: полином неба 2-го порядка по x, y вне туманности с кольцом 300 px и круга 900 px (только показ)
  sky_poly_exclude: data/reference/ngc3132_slope_exclusion.fits
  sky_poly_taper_px: 300   # поправка гаснет к туманности на ширине кольца — туманность не трогается
  per_filter:
    # По маске туманности; по кадру было 99.95 и 99.5 (фаза 3c).
    F405N: { white: 99.9, a: 0.05 }
    F470N: { white: 99.9, a: 0.05 }
    F212N: { white: 99.0 }
    F090W: { white: 99.98 }   # 3i: по туманности без звёзд, с подъёмом по max — синий в inner ≥ 0,99 у 2,2% (99.6 — 7,4%)
    F187N: { white: 99.98 }
  saturated_stars: { enabled: false }  # 3i: закрыто — ядра звёзд с насыщением остаются белым пятном 30–40 px (см. PLAN)
color:
  overrides:
    F356W: "#ff9a20"
  saturation: 1.2         # 3k: выбор владельца 2026-10-20 по листам 25 (было 1.4) — разброс яркости inner 0,177 / edge 0,115 против NASA 0,184 / 0,100
  weights: { F212N: 0.12, F405N: 0.25 }   # меньше зелёного в оболочке (H2), меньше красного в середине (Brα)
  shadows: { value: 2, scope: nebula, by: max, above_sky: true }   # 3k: value 2 — выбор владельца 2026-10-20 по листам 25 (было 4); 3i: по самому яркому каналу; 3k: над уровнем неба
  saturation_gamut: limit  # 3i: насыщенность без обрезки, самый яркий канал пикселя не меняется
  background_keep_level: true   # 3k: нейтрализация снимает только цветовой сдвиг, небо остаётся на пьедестале
  star_saturation: 1       # 3j: выбор владельца 2026-10-19 по листу 18 — обесцвечивание звёзд поля выключено; одна звезда из 61
                           # с зелёноватым ядром (лист 19, x 586, y 62) принята как известное
  star_chroma: { enabled: true }   # 3j: цвет звёзд с насыщенным ядром вне маски туманности (у NGC 3132 — внизу справа) без пёстрой крупы на лучах
finish:
  stars: { scale: 1, shrink: 0 }                 # 3j: выбор владельца 2026-10-19 по листу 18 (проверка_3j): звёзды поля не гасятся и не сжимаются
  local_contrast: { radius: 80, amount: 0.3 }    # 3k: amount 0.3 — выбор владельца 2026-10-20 по листам 25 (было 0.6); 3i: без рельса у 1
