# «Витринный» стиль NGC 1365: старт — финал W3-2 (phase-6). Референса нет, критерии внутренние: небо без нулей,
# выжжено ≤ 0,5%, прямых границ при ×5 нет, звёзды не зелёные, фактура рукавов видна при 100%.
extends: base
stretch:
  method: asinh
  anchor: masks            # black — по пустому небу, white — по маске галактики
  white: 99.8              # как W3
  a: 0.03                  # решение 2026-10-23: при 0,05 и носке 4 небо 8/7/10 вместо 16
  black_mode: pedestal
  black_k: 10              # 2026-10-23: при 3 небо g/r/i ниже цели (носок только опускает) — 10/8/12; при 10 — 17/16/17
  sky_level: 16
  sky_reference: darkest_blocks   # здесь пустое небо есть — проверить кропами sky/sky2 при ×5
  sky_reference_min_free: 0.3
  sky_toe_max_p: 8          # решение 2026-10-23: при bin 1 небо выше цели (шум на пиксель вчетверо выше), p упирался в 4 — 19/18/19
  exclude_point_sources: { max_fwhm_psf: 1.5 }   # белая точка по галактике без звёзд; звезда — не шире 1,5 PSF
                           # (решение 2026-10-23: узлы и фоновые галактики шире — часть объекта)
  core: {}                 # решение 2026-10-23: режим ядра — вторая белая точка по сглаженной яркости (правило пятна
                           # не нужно: на прогоне шага 2 не сработало — доля 43–79%)
color:
  mode: manual
  blend: average
  overrides:               # задание консультанта (фаза 9, шаг 2): по длине волны
    u: "#7040ff"           # фиолетово-синий
    g: "#3060ff"           # синий
    r: "#c0ff40"           # зелёно-жёлтый
    i: "#ff2020"           # красный
  saturation: 1.4
  saturation_gamut: limit
  saturation_above_sky: 12
  shadows: { value: 0, scope: nebula, by: max, above_sky: true }
  background_keep_level: true
  neutral_background: off
  star_saturation: 1
finish:
  nodata_fill: sky
  stars: { scale: 1, shrink: 0 }
  local_contrast: { radius: 80, amount: 0.3 }
