# Sh 2-305 (Sharpless 305), JWST NIRCam, программа GO 4547 (PI McCaughrean), цель S305_offset: мозаика 6 плиток ×
# 4 дизеринга, ~51′², снято 2025-03-31, эксклюзив снят 2026-04-02. Выбор владельца 2026-10-20 (фаза 4, discover).
# Общее для стилей: объект, данные, геометрия, очистка, маски. Стили (extends: base) меняют растяжку, цвет и финиш.
target: "Sh 2-305"
slug: sh2305
coords: "112.5327 -18.5581"   # центр мозаики S305_offset по MAST (имя Sh 2-305 резолвится не везде)
radius: "6 arcmin"
mission: jwst
instrument: nircam
proposal_id: "4547"
# Решение владельца 2026-10-20: первая сборка на четырёх длинноволновых — там туманность. F140M, F162M, F182M —
# звёзды и слабый фон (не берутся); F212N (H₂-волокна) на i2d уровня 3 непригоден: сплошные полосы 1/f — главный
# сигнал кадра при ×5 (лист проверка_4/02); его — следующим шагом с уровня 2 (source на фильтр), после приёмки.
# Шаг 7 (решение владельца 2026-10-21, палитра В): + F182M — синий слой звёзд и полости пузыря (Paα); полосы 1/f уровня 3
# видны при ×5, не при 100% после растяжки (листы проверка_4/шаг6/65, 67, 68). Кадр уже на ~6″: F182M покрывает меньше.
filters: [F182M, F300M, F335M, F360M, F444W]
calib_level: 3
source: level3            # решение владельца 2026-10-20: готовые мозаики i2d, без своей сборки уровня 2
reference: F444W          # сетка длинноволновых 0,063″/px (решение владельца)
align:
  crop: union             # полный кадр — объединение покрытий, как у NGC 3132 (3h)
  require_all: true       # на краях все фильтры — без полосы своего баланса цвета
bin: 4                    # подбор параметров; финал — bin 1
stars:
  fill_cores: true        # насыщенные ядра (дыры WHT=0) заполняются кольцами — белые, без цветной точки
  max_core_arcsec: 4.0    # решение владельца 2026-10-21: ядро яркой звезды в F444W ~3″ (при 2″ — не заполнялось, лист 05)
clean:
  destripe:
    enabled: false        # destripe мозаики i2d по CON (3d) на этом поле рисует горизонтальные полосы у стыков
                          # (F444W: скачки CON 0,56σ → 2,55σ, лист проверка_4/04) — медианы строк по туманности
background:
  subtract: true
  # Решение владельца 2026-10-21: пьедесталы плиток CON (3a) выключены — туманность почти во всём кадре, уровни
  # областей оцениваются по ней: скачки на границах CON по небу 0,34–0,56σ → 2,8–6,0σ, новые прямые ступеньки
  # (лист проверка_4/03). Мозаика как есть ровная.
  tiles: false
  smooth: false           # как у NGC 3132 после 3g: гладкая модель портила цвет фона
  nebula_mask_exclude: [F182M]   # шаг 7: с F182M маска туманности 21 → 30% кадра (bin 1), тени поднимали пятно в seam
                                 # (лист шаг6/69); в самом F182M там свечения нет — маску строят 4 длинноволновых
report:
  baseline: phase-4          # принятый результат для сравнения: data/baselines/sh2305/phase-4/ (приёмка 2026-10-21)
  crops:                  # центр на небе (ra, dec, градусы); размер — px при bin 1 (0,0629″/px). Мозаика: RA вверх, Dec вправо (до поворота на север)
    - { name: star, ra: 112.5700, dec: -18.5975, size: 1900 }    # яркая звезда: ореол и шесть лучей, 120″
    - { name: bubble, ra: 112.5120, dec: -18.5450, size: 1590 }  # центр пузыря (кольцо снизу справа на превью), 100″
    - { name: filaments, ra: 112.5000, dec: -18.5600, size: 640 }  # волокна F335M в середине, 40″
    - { name: globule, ra: 112.5565, dec: -18.5310, size: 480 }  # тёмная глобула с ярким ободом вверху справа, 30″
    - { name: sky, ra: 112.4900, dec: -18.6100, size: 400 }      # пустое небо, левая колонка плиток (4 экспозиции)
    - { name: sky2, ra: 112.5450, dec: -18.5050, size: 400 }     # пустое небо, правая колонка плиток
    - { name: seam, ra: 112.5400, dec: -18.5700, size: 500 }     # стык плиток: граница полосы перекрытия колонок (4 → 8 экспозиций)
    - { name: gap212, ra: 112.5350, dec: -18.6100, size: 500 }   # щель коротковолновых детекторов F212N (для будущего слоя F212N)
