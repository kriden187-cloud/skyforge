# «Витринный» стиль Sh2-305: старт — настройки showcase NGC 3132 (3k); референса нет, критерии внутренние
# (небо на 6 без обрезки, прямых границ при ×5 нет, звёзды не зелёные, выжжено ≤ 0,5%, волокна читаются при 100%).
extends: base
stretch:
  method: asinh
  anchor: masks            # black — по пустому небу, white — по маске туманности
  white: 99.8              # шаг 8, решение владельца 2026-10-21 (лист шаг8/73): при тенях 0 светлее и ближе к Тевено по
                           # промежуткам (туманность / промежутки 104 / 64 против её 101 / 69), выжжено 0,32% в пороге;
                           # хвост яркости в маске крутой — 99,9-й процентиль в 1,7–2,4 раза выше 99,8-го.
                           # (Шаг 3, до носка с пределом и без теней 0: 99.8 давало 7% нулей в G — теперь нулей нет.)
  a: 0.02                  # шаг 4: слабый свет между волокнами и в пузыре (лист шаг4/53; было 0.1 — шаг 3, лист 11);
                           # при bin 1 с носком max_p 4: нулей 0 / 0 / 0,02%, выжжено 0,25%, разброс bubble 91% (a 0.03 — 96%)
  black_mode: pedestal     # 3k: чёрная точка на 3σ ниже неба самых шумных мест — шум неба не обрезается в 0
  black_k: 3
  sky_level: 10            # шаг 4: при сильном наклоне шуму неба нужно место (6 — нули в G 2–18%, лист шаг4/53)
  sky_toe_max_p: 4         # шаг 4: носок без «стенки» — степень ≤ 4 (без ограничения p 135–340 при a 0.02–0.03,
                           # шум чуть ниже неба уходил в 0: в слое F335M 20–30% неба); у NGC 3132 и Hubble флаг не задан
  per_filter:
    F335M: { black_k: 8 }   # финал bin 1 (решение владельца 2026-10-21): шум неба F335M σ 7,9 уровня при небе 6 — с
                            # saturation_above_sky нулей в G неба 0,47% (без них 3,25%); bin 2 дал бы запас ценой разрешения
color:
  mode: manual
  blend: average
  overrides:               # шаг 7, выбор владельца 2026-10-21 — палитра В (лист шаг6/64): тёплый сдвиг + F182M, порядок по
                           # длине волны сохранён (оттенки 231° / 200° / 80° / 30° / 0°). Палитра А (чистые основные) давала
                           # однотонное «желе» PAH (шаг 5); тёплый сдвиг снижает цветность вдвое, F182M даёт синие звёзды и
                           # фиолетовую полость пузыря
    F182M: "#3050ff"
    F300M: "#40c0ff"
    F335M: "#c0ff40"
    F360M: "#ff9020"
    F444W: "#ff2020"
  saturation: 1.4          # шаг 7 (лист шаг7/70, палитра В): цветность волокон 1.2 / 1.4 / 1.6 — 55 / 63 / 71 (Тевено 59),
                           # нули неба, выжигание, зелень звёзд одинаковы; 1.4 — по умолчанию консультанта, если владелец не выбрал
  saturation_gamut: limit  # 3i: насыщенность без обрезки, самый яркий канал пикселя не меняется
  saturation_above_sky: 12 # финал bin 1 (решение владельца 2026-10-21, как Hubble 3б): насыщенность от 1 на уровне неба
                           # до 1.2 на 12 уровней выше — шумный канал неба не выталкивается за 0
  shadows: { value: 0, scope: nebula, by: max, above_sky: true }   # шаг 8, решение владельца 2026-10-21 (лист шаг7/72):
                           # подъём теней на слабых волокнах PAH превращал пряди в плотные сгустки с резким краем (было 4,
                           # шаг 3); при 0 — пряди и полупрозрачная дымка, туманность темнее (медиана 71 против 111)
  background_keep_level: true   # 3k: нейтрализация снимает только цветовой сдвиг, небо остаётся на 6 уровнях
  neutral_background: off  # шаг 3: слои неба ровно по 6, а карта нейтрализации сдвигала каналы (5,94/5,55/6,59) — как у Hubble в 3б
  star_saturation: 1       # звёзды как есть (как NGC 3132 3j); проверка «не зелёные» — по кропам
finish:
  stars: { scale: 1, shrink: 0 }
  local_contrast: { radius: 80, amount: 0.3 }   # как NGC 3132 3k
