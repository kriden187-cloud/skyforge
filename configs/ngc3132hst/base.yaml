# Туманность Южное Кольцо (NGC 3132) глазами Hubble: WFPC2, программа 6221 (1995-12-07), узкие фильтры.
# Для сравнения с configs/ngc3132/ (JWST NIRCam): оптика против инфракрасного. Общее для стилей: объект, данные,
# геометрия, очистка; стили лежат рядом (extends: base).
target: "NGC 3132"
slug: ngc3132hst
mission: hst
instrument: wfpc2
proposal_id: "6221"           # один визит: все фильтры с одного наведения
filters: [F502N, F656N, F658N]   # [O III], Hα, [N II]
calib_level: 3                # HAP-SVM _drz: мозаика всех четырёх чипов, астрометрия по Gaia
reference: F656N
bin: 2                        # подбор параметров; 1 для финала
clean:
  destripe:
    enabled: false            # полосы 1/f — у детекторов NIRCam; у WFPC2 их нет
  fill_gaps_px: 0             # 3б: швы чипов в общем случае честно пустые (measured); showcase — заполнение (стиль)
  cosmics:
    clean: true               # 3б: одна экспозиция на фильтр — лучи по форме (резче PSF) и по отсутствию в двух других фильтрах
    skip_filters: [F658N]     # F658N — две экспозиции (u2rc0205+06) без сдвига: лучи убраны сложением, кроме совпавших; в туманности чистка резала волокна
    sky_pass: true            # 3б: второй, мягкий проход по небу вне туманности (с защитой по F658N; до неё удалял пики 17 звёзд F656N)
    sky_trusted: true         # 3б шаг 3: на небе чистить и F658N — точки только в нём (совпали в двух экспозициях без сдвига), 26 шт.
    sky_smoothed_sigma: false # 3б шаг 4: с σ средних 3×3 по самой карте задевались звёзды неба (F656N: 1 из 14 и 19 из 60 источников F658N+F656N) — выкл. по правилу второго прохода
stars:
  sky_detect_filter: F658N    # 3б шаг 3: звёзды неба — по шуму неба в F658N (две экспозиции, без лучей); по σ кадра (рамка вокруг туманности) находилась 1 из 8
reference_image: data/reference/ngc3132_hubble1998.jpg   # STScI-1998-39 (Hubble Heritage, ESA opo9839a), 935×700
finish:
  north_up: true              # 3б: север вверх (решение по шагу 0); поворот по форме поля (align.auto_rotate) — выкл.
align:
  crop: box                   # 3б: рамка вокруг туманности на небе; общее поле «север вверх» резало туманность (78%)
  box: { ra: 151.756609, dec: -40.436117, width_arcsec: 85, height_arcsec: 97 }   # туманность + 40 px bin 2; углы вне поля WFPC2 пустые (~6%)
  auto_rotate: false
background:
  tiles: false                # плитки CTX — механика мозаик JWST; у WFPC2 стыки — зазоры чипов, а не плитки
  smooth: false               # гладкая модель фона — как в JWST (3g), выключена; крупный ход неба — полином в стиле
stretch:
  anchor: masks               # чёрная точка по пустому небу, белая по туманности — от миссии не зависит
color:
  mode: manual                # палитра референса STScI-1998-39 (метаданные AVM), а не по длине волны
  overrides:
    F502N: "#0000ff"          # [O III] 502 нм — синий
    F656N: "#00ff00"          # Hα 656 нм — зелёный
    F658N: "#ff0000"          # [N II] 658 нм — красный
report:
  baseline: phase-3b          # принятый результат для сравнения: data/baselines/ngc3132hst/phase-3b/ (приёмка 2026-10-20)
  crops:                      # центр кропа на небе (ra, dec, градусы); размер — px при bin 1 (0,0455″/px)
    - { name: center, ra: 151.757305, dec: -40.43642, size: 400 }    # центральная звезда (та же точка, что у JWST)
    - { name: edge, ra: 151.754903, dec: -40.447428, size: 400 }     # край оболочки — та же точка, что edge у JWST
    - { name: sky, ra: 151.728569, dec: -40.450272, size: 400 }      # пустое небо, правый нижний чип WF
    - { name: sky2, ra: 151.760145, dec: -40.418647, size: 400 }     # пустое небо, верхний левый чип WF
    - { name: gap, ra: 151.746537, dec: -40.43164, size: 400 }       # шов чипов у края туманности (зазор пустой)
