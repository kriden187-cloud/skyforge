# «Витринный» стиль Hubble: палитра пресс-релиза STScI-1998-39 (Hubble Heritage); небо — как в JWST showcase 3k.
# Итог — bin 2 (0,091″/px, родной масштаб WF-чипов WFPC2): bin 1 — передискретизация drizzle, деталей не добавляет,
# пороги чистки на него не настроены (выбор владельца 2026-10-20).
extends: base
clean:
  fill_gaps_px: 6             # 3б: швы чипов и чёрточки ≤ 6 px по полуширине — линейно поперёк шва (решение Дениса, только showcase)
stretch:
  white: 99.9                 # 3б шаг 3: по туманности без звёзд; выжжено 0,4% туманности (99.8 — 0,8%)
  a: 0.1                      # 3б шаг 3: 0.02 высветлял оболочку до бледно-жёлтой; 0.1 ближе к Heritage (как JWST)
  black_mode: pedestal        # 3k: чёрная точка на 3σ ниже неба самых шумных мест — шум неба не обрезается в 0
  black_k: 3
  sky_level: 6                # 3k: носок — медиана неба каждого фильтра → 6 уровней из 255, без обрезки
  per_filter:
    F502N: { black_k: 5 }     # 3б: одна экспозиция, шумный синий — пьедестал ниже; вместе с saturation_above_sky нулей 0,24% (выбор владельца 2026-10-20)
color:
  shadows: { value: 2, scope: nebula, by: max, above_sky: true }   # 3б шаг 3: 2 — оболочка светлее; 4 — видна граница маски на краю
  saturation: 1.2                # 3б шаг 3: оболочка золотисто-оранжевая, середина бирюзовая; 1.4 — середина в яркий голубой
  saturation_gamut: limit        # насыщенность не меняет самый яркий канал (без рельса у 1)
  saturation_above_sky: 12       # 3б: насыщенность от 1 на уровне неба до 1.2 на 12 уровней выше — шум синего неба не уходит в 0
                                 # (было 1,24% нулей, стало 0,24% — предел одной экспозиции; выбор владельца 2026-10-20)
  # Усиление красного (F658N) — 1.0, не задаётся: выбор владельца 2026-10-20, достоверность важнее сходства с Heritage;
  # 1.3 выжигал 6,5% кольца против 0,4% (лист проверка_3b/шаг4/32).
  star_saturation: 0.25          # 3б шаг 3: звёзды неба почти нейтральные (0 — серые, 0.5 — зелень видна); лист шаг3/21; утверждено
  star_saturation_scope: sky     # 3б шаг 3: приглушать только звёзды неба — зелень звёзд от растяжки по туманности (решение Дениса)
  background_keep_level: true    # 3k: нейтрализация снимает только цветовой сдвиг, небо остаётся на 6 уровнях
  neutral_background: off        # 3б: каждый фильтр — чистый канал, носок ставит небо каждого на 6 — небо нейтрально само;
                                 # нейтрализация с картой цвета сдвигала каналы (R 4,9 / G 5,6 / B 9,2 — небо синело)
finish:
  nodata_fill: sky               # 3б: углы без данных ни в одном фильтре — ровный уровень неба 6 без шума (выбор владельца 2026-10-20);
                                 # в PNG углы прозрачные по альфе; measured не трогается
