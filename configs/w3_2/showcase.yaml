# «Витринный» стиль W3-2: старт — финал Sh2-305 (phase-4). Референса нет, критерии внутренние: небо без нулей,
# выжжено ≤ 0,5%, прямых границ при ×5 нет, звёзды не зелёные, фактура видна при 100%.
extends: base
stretch:
  method: asinh
  anchor: masks            # black — по пустому небу, white — по маске туманности
  white: 99.8              # как финал Sh2-305
  a: 0.05                  # решение 2026-10-22 (вариант б): при 0,02 небо 33/27/23 вместо 16 — белые точки коротких близки к
                           # небу (F140M 1,42 при чёрной 0,31), носок с пределом 4 не дотягивает; 0,05 — небо 25/22/19,
                           # баланс слоёв ±12%. Остаток над 16 — в ограничениях
  black_mode: pedestal     # чёрная точка на 3σ ниже неба самых шумных мест — шум неба не обрезается в 0
  black_k: 3
  sky_level: 16
  sky_reference: darkest_blocks   # правило HANDOFF: на сплошной туманности опора — самые тёмные блоки опорного фильтра
  sky_reference_min_free: 0.3   # финал bin 1, 2026-10-22: при 0,5 блоков с долей чистых пикселей проходит 4 из 27 (маска звёзд
                           # с отступом 38% кадра), два опорных — в туманности (F444W 4,3 и 5,1 против 2,4): небо в ноль.
                           # При 0,3 на bin 4 и bin 1 — одни и те же три блока у правого края правого модуля (F444W 2,0–2,2)
  sky_toe_max_p: 4
  exclude_point_sources: {}  # решение 2026-10-22: белая точка по туманности без звёзд в каждом фильтре — маска звёзд clean
                           # пропускала звёзды на яркой туманности, 99,8-й процентиль коротких ставили ядра звёзд (лист 44)
color:
  mode: manual
  blend: average
  overrides:               # задание консультанта 2026-10-21: по длине волны с тёплым сдвигом, как палитра В Sh2-305;
                           # порядок строгий — оттенки 254° / 231° / 200° / 155° / 80° / 50° / 30° / 0°; палитра А
                           # оставлена (решение 2026-10-22: А, Б, В на листе 40 неразличимы), F140M — первым
    F140M: "#6030ff"       # фиолетово-синий
    F182M: "#3050ff"       # синий (как Sh2-305)
    F210M: "#40c0ff"       # голубой (F300M у Sh2-305)
    F300M: "#30ffb0"       # зелёно-голубой
    F335M: "#c0ff40"       # жёлто-зелёный (как Sh2-305)
    F360M: "#ffd820"       # жёлтый
    F405N: "#ff9020"       # оранжевый (F360M у Sh2-305)
    F444W: "#ff2020"       # красный (как Sh2-305)
  saturation: 1.4
  saturation_gamut: limit
  saturation_above_sky: 12
  shadows: { value: 0, scope: nebula, by: max, above_sky: true }
  background_keep_level: true
  neutral_background: off
  star_saturation: 1
  fill_gaps: { groups: [[F140M, F182M, F210M, F300M]], block_px: 128 }   # решение 2026-10-21: щели детекторов коротких
                           # (3,5–4,3″, 13% площади модуля) — следующий фильтр группы × гладкая карта отношения; у F140M
                           # щели как у F210M — его закрывает F182M; где нет ни одного короткого — F300M; проба — лист 02
finish:
  nodata_fill: sky         # промежуток между модулями — ровный уровень неба (в PNG прозрачный), как углы Hubble 3б
  stars: { scale: 1, shrink: 0 }
  local_contrast: { radius: 80, amount: 0.3 }
