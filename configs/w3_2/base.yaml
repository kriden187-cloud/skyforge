# W3 (Westerhout 3), поле W3-JWST-2-FINAL: JWST NIRCam, программа GO 5437 (PI Best) «A Census to the Bottom of the
# IMF in W3», одна плитка × 9 дизерингов, ~12′², эксклюзив снят 2025-10-30. Выбор владельца 2026-10-21 (фаза 6,
# шаг 1: обработок в сети не найдено; соседнее поле той же программы W3-JWST-1A — Thomas Carpentier, Flickr, 2025-10-13).
# Общее для стилей: объект, данные, геометрия, очистка, маски. Стили (extends: base) меняют растяжку, цвет и финиш.
target: "W3"
slug: w3_2
coords: "36.5793 61.9840"     # координаты цели программы (TARG_RA/DEC, s_ra MAST); центр кадра i2d — 36.8045 62.0016 (~6′ от цели)
radius: "6 arcmin"           # с "3 arcmin" MAST возвращает 0 наблюдений при центре в 0′ (2026-10-21), с 6′ — ровно 12 этого поля
mast_target: W3-JWST-2-FINAL  # у программы три соседних поля (1A, 2, 3A в ~5′) — только это
mission: jwst
instrument: nircam
proposal_id: "5437"
# Решение консультанта 2026-10-21 (фаза 6, шаг 2): первая сборка — 7 фильтров. Длинноволновые с туманностью
# F300M, F335M, F360M, F405N, F444W и F182M, F210M — звёзды и коротковолновая структура. F187N и F470N не берутся:
# полосы 1/f на уровне 3 (870 с; разведка, recon/w3-jwst-2-final-5437_crops.png); F115W, F140M, F162M отложены — звёзды.
filters: [F182M, F210M, F300M, F335M, F360M, F405N, F444W]
calib_level: 3
source: level3            # готовые мозаики i2d
reference: F444W          # сетка длинноволновых 0,063″/px, как у Sh2-305
align:
  crop: union
  require_all: true       # на краях все фильтры — без полосы своего баланса цвета. Поле — два модуля NIRCam (A и B, ~120″×105″,
                          # промежуток ~55″); короткие и длинные сняты в двух положениях (сдвиг ~25″ и 10″): прямоугольник
                          # «все 7 на краях» — на каждый модуль, между ними пусто (решение 2026-10-21, диптих; лист проверка_6/00)
bin: 4                    # подбор параметров; финал — bin 1
stars:
  fill_cores: true        # насыщенные ядра (дыры WHT=0) заполняются кольцами
  max_core_arcsec: 4.0    # как у Sh2-305 (ядро яркой звезды в F444W ~3″)
clean:
  destripe:
    enabled: false        # как у Sh2-305: медианы строк по сплошной туманности рисуют полосы
background:
  subtract: true
  tiles: false            # как у Sh2-305: туманность почти во всём кадре — уровни областей CON по ней не оцениваются
  smooth: false
finish:
  north_up: false         # сетка F444W как есть: при повороте на север квадраты модулей наклонены и прямоугольник «все 7 на
                          # краях» срезал бы их углы
report:
  crops:                  # центр на небе (ra, dec, градусы); размер — px при bin 1 (0,0629″/px); сетка F444W как есть (не север вверх)
    - { name: star1, ra: 36.77471, dec: 61.99389, size: 400 }    # яркая звезда вверху левого модуля: лучи, ядро
    - { name: star2, ra: 36.77639, dec: 62.00356, size: 400 }    # яркая звезда у правого края левого модуля (кроп сдвинут внутрь модуля)
    - { name: lanes, ra: 36.75235, dec: 61.99941, size: 800 }    # тёмные пылевые прожилки, левый модуль
    - { name: globule, ra: 36.76711, dec: 62.00184, size: 400 }  # тёмная глобула с ярким ободом
    - { name: cloud, ra: 36.83277, dec: 61.99971, size: 800 }    # яркое облако, правый модуль
    - { name: sky, ra: 36.87919, dec: 61.99502, size: 400 }      # тёмное небо со звёздами, правый верхний угол правого модуля
    - { name: sky2, ra: 36.87220, dec: 62.01417, size: 400 }     # тёмный участок внизу правого модуля
    - { name: gap, ra: 36.84977, dec: 62.00201, size: 600 }      # перекрестье щелей F182M и F210M, правый модуль
