# W3 (Westerhout 3), поле W3-JWST-2-FINAL: JWST NIRCam, программа GO 5437 (PI Best) «A Census to the Bottom of the
# IMF in W3», одна плитка × 9 дизерингов, ~12′², эксклюзив снят 2025-10-30. Выбор владельца 2026-10-21 (фаза 6,
# шаг 1: обработок в сети не найдено; соседнее поле той же программы W3-JWST-1A — Thomas Carpentier, Flickr, 2025-10-13).
# Общее для стилей: объект, данные, геометрия, очистка, маски. Стили (extends: base) меняют растяжку, цвет и финиш.
target: "W3"
slug: w3_2
coords: "36.5793 61.9840"     # центр поля W3-JWST-2-FINAL по MAST
radius: "6 arcmin"           # с "3 arcmin" MAST возвращает 0 наблюдений при центре в 0′ (2026-10-21), с 6′ — ровно 12 этого поля
mast_target: W3-JWST-2-FINAL  # у программы три соседних поля (1A, 2, 3A в ~5′) — только это
mission: jwst
instrument: nircam
proposal_id: "5437"
# Решение консультанта 2026-10-21 (фаза 6, шаг 2): первая сборка — 7 фильтров. Длинноволновые с туманностью
# F300M, F335M, F360M, F405N, F444W и F182M, F210M — звёзды и коротковолновая структура. F187N и F470N не берутся:
# полосы 1/f на уровне 3 (870 с; разведка, recon/w3-jwst-2-final-5437_crops.png); F115W, F140M, F162M отложены — звёзды.
filters: [F182M, F210M, F300M, F335M, F360M, F405N, F444W]
calib_level: 3
source: level3            # готовые мозаики i2d
reference: F444W          # сетка длинноволновых 0,063″/px, как у Sh2-305
align:
  crop: union
  require_all: true       # на краях все фильтры — без полосы своего баланса цвета
bin: 4                    # подбор параметров; финал — bin 1
stars:
  fill_cores: true        # насыщенные ядра (дыры WHT=0) заполняются кольцами
  max_core_arcsec: 4.0    # как у Sh2-305 (ядро яркой звезды в F444W ~3″)
clean:
  destripe:
    enabled: false        # как у Sh2-305: медианы строк по сплошной туманности рисуют полосы
background:
  subtract: true
  tiles: false            # как у Sh2-305: туманность почти во всём кадре — уровни областей CON по ней не оцениваются
  smooth: false
