# Туманность Южное Кольцо (NGC 3132), JWST NIRCam, программа ERO 2733.
target: "NGC 3132"
mission: jwst
instrument: nircam
filters: [F090W, F187N, F212N, F356W, F405N, F470N]   # тот же набор, что в пресс-релизе
calib_level: 3            # готовая мозаика со всех экспозиций, а не отдельные кадры уровня 2
reference: F470N          # кадр, к сетке которого приводятся остальные
bin: 4                    # уменьшение для подбора параметров; 1 для финала
stretch:
  method: asinh
  black: 0.5              # процентиль фона
  white: 99.8             # процентиль ярких деталей
  a: 0.1                  # сила asinh: 0.02 из плана выжигала центр туманности (см. sweep)
color:
  mode: wavelength        # короткие волны → синий, длинные → красный
  blend: average          # screen при шести фильтрах сводит всё в жёлто-белое
  lift: 0.25              # подъём теней после смешивания: average гасит оболочку, яркую в 2–3 фильтрах из 6
  saturation: 1.2
  overrides:              # палитра официального снимка STScI
    F090W: "#0000ff"      # синий
    F187N: "#00ffff"      # голубой
    F212N: "#00ff00"      # зелёный
    F356W: "#ffff00"      # жёлтый
    F405N: "#ff0000"      # красный
    F470N: "#ff0000"      # красный
finish:
  denoise: 0.1             # 0.3 давал «пластилин» на 100%
  sharpen: 0.5
  north_up: false         # мозаика повёрнута на ~35°: поворот на север срезал бы 40% кадра
