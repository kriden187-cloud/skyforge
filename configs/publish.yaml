        - { file: "The star-forming region Sharpless 305 (Sh 2-305) & RAFGL5232 as seen with JWST (55209728128).jpg",
            ru: "Марк Маккохрейн, руководитель программы", en: "Mark McCaughrean, program PI" }
    notes_ru:
      - "Данные открыты 2026-04-02. Известные более ранние обработки этих данных: Мелина Тевено (Wikimedia Commons, 2026-04-03); Томас Карпантье (Flickr, 2026-04-03); Исраэль Веласкес Родригес (Flickr, 2026-04-03); Андреа Лук (Flickr, 2026-04-11); Марк Маккохрейн, руководитель программы (Flickr, 2026-04-15, копия на Wikimedia Commons); Мехмет Хакан Озсарач (Flickr, 2026-05-18); Picturavis (Pixelfed, около 2026-05-22)."
