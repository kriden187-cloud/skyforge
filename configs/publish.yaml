# Фаза 5: публикация принятых результатов (skyforge publish, skyforge gallery).
# Факты подписи — из конфига объекта, заголовков FITS (программа, руководитель, даты наблюдений), манифеста (дата открытия
# данных) и метаданных принятого PNG (цвета фильтров, хеш конфига); здесь — только то, чего в данных нет.

# Решения владельца 2026-10-21 (фаза 5, п. 4): лицензия CC BY-SA 4.0, автор Denis Krivosheev, без водяного знака.
# Имя автора публикации — только здесь: в конфигах объектов (author: Denis) и в метаданных принятых прогонов оно прежнее,
# пиксели те же; publish и gallery берут имя отсюда.
author: Denis Krivosheev
license: CC BY-SA 4.0
license_url: https://creativecommons.org/licenses/by-sa/4.0/
watermark: false            # подпись только в тексте и метаданных, на картинке — ничего
repo: https://github.com/kriden187-cloud/skyforge   # ссылки на конфиг и тег в подписи и галерее

# Формула источника для производных работ из архивных данных MAST (проверка 2026-10-21, ссылки — docs/PLAN.md, фаза 5):
# NASA — «NASA should be acknowledged as the source»; ESA/Webb — кредит без изменений, свои правки — после него.
credit:
  jwst: NASA, ESA, CSA, STScI
  hst: NASA, ESA, STScI

# Flickr: тексты *_flickr.txt (абзацы — шаблоны: {program} {pi} {obs} {release} {filters} {repo_line} {stem} {master_size}
# {master_mb} подставляются из данных; кредит и лицензия дописываются сами). Реестр published — ссылки на выложенное.
flickr:
  album: "Skyforge — JWST & Hubble"
  license_label: "Attribution-ShareAlike (CC BY-SA 4.0)"

# Версии под площадки: длинная сторона, px; JPEG, sRGB, Lanczos, без резкости сверх финала; только полный кадр.
sizes:
  web: { long: 2048, quality: 92 }
  social: { long: 1600, quality: 92 }
  preview: { long: 800, quality: 92 }

# Слова, которых не должно быть в подписи (проверка при publish и в тестах), по основе слова, без учёта регистра.
stop_words: [перв, уникальн, единствен, first, unique, only one, never before, впервые]

# Wikimedia Commons (шаг 2 публикации): имя файла (на 2026-10-21 на Commons свободно), категории — существующие, как у файлов
# тех же объектов на Commons (проверено через API 2026-10-21: «Sharpless 305» и «Hubble Space Telescope images» не существуют).
objects:
  ngc3132:
    accepted: 2026-10-20
    flickr:
      style: showcase
      file: web
      file_note: "(or {stem}_master.png for full size)"
      title: "Southern Ring Nebula (NGC 3132) — JWST NIRCam, six filters"
      filter_notes: { F212N: molecular hydrogen }
      paragraphs:
        - >-
          Planetary nebula NGC 3132, the Southern Ring, imaged by the James Webb Space Telescope (NIRCam).
          Program {program} (Early Release Observations), PI {pi}; observed {obs}, data public in MAST since {release}.
          This is the same data behind the official July 2022 release (STScI 2022-033b).
        - >-
          Six filters, colours ordered by wavelength: {filters}. The outer green-orange halo is H₂ emission;
          the blue interior is hot gas around the central pair of stars.
        - >-
          My own processing of the public data, built as a mosaic from the 120 individual level-2 exposures rather than
          the archive's combined image, with detector striping removed per exposure. Fully reproducible from a YAML config:
          {repo_line}.
      tags: [JWST, Webb, James Webb Space Telescope, NIRCam, NGC 3132, Southern Ring Nebula, Caldwell 74, planetary nebula,
             Vela, nebula, astrophotography, MAST, JWST program 2733, ERO, Skyforge]
    published:
      - { style: showcase, platform: Flickr, url: "https://www.flickr.com/photos/205062605@N07/55603640956/",
          date: 2026-10-21, license: CC BY-SA 4.0 }
      - { style: showcase, platform: Wikimedia Commons, note: "ждёт" }
    commons:
      style: showcase
      filename: "NGC 3132 JWST NIRCam (Krivosheev).png"
      categories: [NGC 3132, Images by NIRCam, James Webb Space Telescope images of nebulae]
    notes_ru:
      - "Программа ERO 2733 (Early Release Observations); официальный снимок NIRCam — 12 июля 2022 (STScI 2022-033b, ESA/Webb weic2207b, «Southern Ring Nebula (NIRCam Image)»)."
    notes_en:
      - "Program ERO 2733 (Early Release Observations); official NIRCam image released 12 July 2022 (STScI 2022-033b, ESA/Webb weic2207b, “Southern Ring Nebula (NIRCam Image)”)."
    styles:
      measured:
        shown_ru: "Шесть фильтров NIRCam в порядке длины волны, вес F212N 0,25 (ореол H₂ настоящий)."
        shown_en: "Six NIRCam filters in wavelength order, F212N weight 0.25 (the H₂ halo is real)."
        limits_ru: "Ступеньки фона по границам числа экспозиций до ~0,6σ; ядра трёх насыщенных звёзд — белые пятна; лучи ярких звёзд вне маски звёзд."
        limits_en: "Background steps along exposure-count boundaries up to ~0.6σ; cores of three saturated stars are white; bright-star spikes are outside the star mask."
      showcase:
        shown_ru: "Витрина в духе релиза NASA: пьедестал и носок неба, полином неба с гашением к туманности, подъём теней 2, насыщенность 1,2."
        shown_en: "Showcase in the spirit of the NASA release: sky pedestal and toe, sky polynomial tapered towards the nebula, shadows 2, saturation 1.2."
        limits_ru: "Ступеньки по границам числа экспозиций; три детали фона видны при ×2–×5; внешний ореол слабее, чем у NASA; одна звезда поля с зеленоватым ядром."
        limits_en: "Steps along exposure-count boundaries; three background details visible at ×2–×5; outer halo fainter than NASA's; one field star with a greenish core."
  ngc3132hst:
    accepted: 2026-10-20
    flickr:
      style: showcase
      file: master
      file_note: "({master_size}; the web/social versions are the same size)"
      title: "Southern Ring Nebula (NGC 3132) — Hubble WFPC2, 1995"
      filter_labels: { F502N: "[O III]", F656N: "Hα", F658N: "[N II]" }
      paragraphs:
        - >-
          Planetary nebula NGC 3132 as seen by the Hubble Space Telescope's WFPC2 camera on {obs}. Program {program},
          PI {pi}. The same data underlie the 1998 Hubble Heritage image (STScI-1998-39); this is my own processing
          from the archive files.
        - >-
          Three narrow-band filters: {filters}. Blue traces the hottest, doubly ionised oxygen in the interior; red the
          cooler nitrogen at the rim. Cosmic-ray hits were removed by cross-checking filters; the chip seams of WFPC2 are
          interpolated (≤ 6 px), the corners outside the field are filled at sky level.
        - >-
          Fully reproducible from a YAML config: {repo_line}. Companion to my JWST image of the same nebula.
      tags: [Hubble, HST, Hubble Space Telescope, WFPC2, NGC 3132, Southern Ring Nebula, Caldwell 74, planetary nebula, Vela,
             nebula, astrophotography, MAST, HST program 6221, Skyforge]
    published:               # решение владельца 2026-10-21: на Flickr не публиковать (картинка слабее остальных); остаётся
                             # в репозитории и галерее как часть сравнения «Hubble 1995 / JWST 2022»
      - { style: showcase, platform: Flickr, note: "не публикуется — решение владельца 2026-10-21: картинка слабее остальных; остаётся в репозитории и галерее как часть сравнения «Hubble 1995 / JWST 2022»" }
    commons:
      style: showcase
      filename: "NGC 3132 HST WFPC2 1995 (Krivosheev).png"
      categories: [NGC 3132, Hubble images of nebulae]
    jpeg_quality: 98          # все версии: шумный синий канал F502N — при 92 медиана |Δ| к мастеру в синем 2 уровня (шум сжатия,
                              # сдвига тона нет), при 98 — 1; файл ~665 КБ против 211 КБ (лист out/publish/проверка_5/90_тон_версий.tsv)
    pi: "Trauger, John"       # в заголовке drz нет — MAST, Observations.query_criteria(proposal_id=6221).proposal_pi
    notes_ru:
      - "Те же данные WFPC2 легли в основу снимка Hubble Heritage 1998 года (STScI-1998-39)."
    notes_en:
      - "The same WFPC2 data underlie the 1998 Hubble Heritage image (STScI-1998-39)."
    styles:
      showcase:
        shown_ru: "WFPC2 1995 года, три узкополосных фильтра ([O III], Hα, [N II]), итог при bin 2."
        shown_en: "WFPC2 data from 1995, three narrow-band filters ([O III], Hα, [N II]), final at bin 2."
        limits_ru: "Bin 2 (bin 1 — передискретизация drizzle); 65 следов космических лучей на небе; 0,25% нулей в синем канале неба; швы ≤ 6 px заполнены линейно, углы — уровнем неба."
        limits_en: "Bin 2 (bin 1 is drizzle oversampling); 65 cosmic-ray traces on the sky; 0.25% zeros in the blue sky channel; seams ≤ 6 px filled linearly, corners at sky level."
  sh2305:
    accepted: 2026-10-21
    flickr:
      style: showcase
      file: web
      file_note: "(or {stem}_master.png for full size, {master_mb} MB)"
      title: "Sharpless 305 (Sh 2-305) — JWST NIRCam, five filters"
      filter_notes: { F335M: PAH emission }
      paragraphs:
        - >-
          Star-forming region Sharpless 305 in Puppis, imaged by the James Webb Space Telescope (NIRCam).
          Program {program}, PI {pi}; observed {obs}, data public in MAST since {release}.
        - >-
          Five filters, colours ordered by wavelength (shorter = bluer): {filters}. The yellow-green filaments are
          polycyclic aromatic hydrocarbons glowing at 3.3 µm; the violet cavity is where that emission is weak and the
          shortest (F182M) and longest (F444W) filters dominate.
        - >-
          My own processing of the public data, fully reproducible from a YAML config: every step and every number is in
          the open-source pipeline at {repo_line}. The sky is set to a measured empty region, nothing is painted by hand.
        - >-
          Other processings of the same data, published earlier: Melina Thévenot (Wikimedia Commons, 2026-04-03),
          Thomas Carpentier, Israel Velázquez Rodríguez, Andrea Luck (Flickr, April 2026), Mark McCaughrean — the program PI
          (Flickr, 2026-04-15), Mehmet Hakan Özsaraç, Picturavis (May 2026).
      tags: [JWST, Webb, James Webb Space Telescope, NIRCam, Sharpless 305, Sh2-305, Sh 2-305, RCW 8, Puppis, HII region,
             star formation, PAH, nebula, astrophotography, MAST, JWST program 4547, Skyforge]
    published:
