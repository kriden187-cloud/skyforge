[project]
name = "skyforge"
version = "0.1.0"
description = "Конвейер обработки снимков JWST и Hubble: от MAST до цветной картинки"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "photutils>=3.1.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tifffile>=2026.10.15",
    "typer>=0.27.3",
]

[project.scripts]
skyforge = "skyforge.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::astropy.wcs.FITSFixedWarning"]
